name: AIOS Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  repository-analysis:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show Python Version
        run: |
          python --version

      - name: Analyze Repository
        run: |
          echo "AIOS Repository Report" > repository-report.txt
          echo "======================" >> repository-report.txt
          echo "" >> repository-report.txt
          echo "Repository : ${{ github.repository }}" >> repository-report.txt
          echo "Branch     : ${{ github.ref_name }}" >> repository-report.txt
          echo "Commit     : ${{ github.sha }}" >> repository-report.txt
          echo "Actor      : ${{ github.actor }}" >> repository-report.txt
          echo "" >> repository-report.txt
          echo "Markdown Files : $(find . -name '*.md' | wc -l)" >> repository-report.txt
          echo "Notebook Files : $(find . -name '*.ipynb' | wc -l)" >> repository-report.txt
          echo "Python Files   : $(find . -name '*.py' | wc -l)" >> repository-report.txt

      - name: Show Report
        run: |
          cat repository-report.txt

      - name: Upload Repository Report
        uses: actions/upload-artifact@v6
        with:
          name: aios-repository-report
          path: repository-report.txt


  report-verification:

    needs: repository-analysis

    runs-on: ubuntu-latest

    steps:

      - name: Download Repository Report
        uses: actions/download-artifact@v7
        with:
          name: aios-repository-report

      - name: Verify Report
        run: |
          ls -la
          echo "-------------------------"
          cat repository-report.txt