name: AIOS Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
jobs:
  repository-check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Repository Information
        run: |
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit     : ${{ github.sha }}"
          echo "Actor      : ${{ github.actor }}"

      - name: Show Directory Tree
        run: |
          pwd
          ls -la

      - name: Count Markdown Files
        run: |
          echo "Markdown Files:"
          find . -name "*.md" | wc -l

      - name: Verify Important Files
        run: |
          test -f README.md
          test -f LICENSE
          test -d .github
          echo "Repository structure looks good."


          